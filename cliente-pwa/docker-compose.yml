version: '3.8'

services:
  assados-vaguinho-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assados_vaguinho_replica
    restart: always
    ports:
      - "8085:80"
    environment:
      - NODE_ENV=production

